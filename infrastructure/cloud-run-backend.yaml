apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: panopticon-backend
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "5"
    spec:
      serviceAccountName: panopticon-runtime@panopticon-495816.iam.gserviceaccount.com
      containers:
        - image: us-central1-docker.pkg.dev/panopticon-495816/panopticon/backend:latest
          ports:
            - containerPort: 8000
          env:
            - name: APP_ENV
              value: production
            - name: GOOGLE_GENAI_USE_VERTEXAI
              value: "true"
            - name: GOOGLE_CLOUD_PROJECT
              value: panopticon-495816
            - name: GOOGLE_CLOUD_LOCATION
              value: us-central1
            - name: GEMINI_ENABLED
              value: "true"
            - name: GEMINI_MODEL
              value: gemini-2.5-flash
            - name: DRY_RUN_ACTIONS
              value: "true"
            - name: DISPATCH_ACTIONS
              value: "true"

