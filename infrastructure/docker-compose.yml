services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: panopticon
      POSTGRES_PASSWORD: panopticon
      POSTGRES_DB: panopticon
    ports:
      - "5432:5432"
    volumes:
      - panopticon-postgres:/var/lib/postgresql/data

  backend:
    build:
      context: ../backend
    environment:
      DATABASE_URL: postgresql+psycopg://panopticon:panopticon@postgres:5432/panopticon
      DRY_RUN_ACTIONS: "true"
    ports:
      - "8000:8000"
    depends_on:
      - postgres

volumes:
  panopticon-postgres:

